[project]
name = "youtube-transcript-mcp"
version = "0.1.0"
description = "An MCP server to extract transcripts and metadata from YouTube videos using yt-dlp."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.9.0",
    "yt-dlp>=2025.1.1",
    "srt>=3.0.0",
]

[project.scripts]
youtube-transcript-mcp = "youtube_transcript_mcp:main"

[project.gui-scripts]
youtube-transcript-mcp = "youtube_transcript_mcp:main"

[tool.setuptools]
packages = ["youtube_transcript_mcp"]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"